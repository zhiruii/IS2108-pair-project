<!doctype html>
<html lang="en">
<p> Hello World! </p>

{% if user.is_authenticated %}
    <p>Logged in as {{ user.email }}</p>
    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Log out</button>
    </form>
{% else %}
    <a href="{% url 'login' %}">Log in</a> | <a href="{% url 'signup' %}">Sign up</a>
{% endif %}

</html>
