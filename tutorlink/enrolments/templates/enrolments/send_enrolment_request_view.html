{% extends 'base.html' %}

{% block title %}Send Enrolment Request{% endblock %}

{% block header %}
    Send an Enrolment request
{% endblock %}

{% block content %}
    <form method="post">
        {% csrf_token %}
        <h2>Tutor: {{ listing.tutor.user.first_name }}
        <br/> Listing: {{ listing }}</h2>
        {{ form }}
        <button type="submit">Submit</button>
        <a href="{% url 'parent_listings_view' %}">Cancel</a>
    </form>
{% endblock %}
