<!DOCTYPE html>
<html>

<head>
    <title>
        Available Listings
    </title>
</head>

<body>
    <h1>Available listings</h1>
    <a href="{% url 'index' %}">Home</a>
    <table border="1" style="width: 100%;">
        <tr>
            <th>Listing</th>
            <th>Tutor</th>
            <th>Rating</th>
            <th>Action</th>
        </tr>
        {% for listing in listings %}
        <tr>
            <td>{{ listing }} : ${{ listing.rate_per_hour }}/hr</td>
            <td>{{ listing.tutor.user }}</td>
            <td>Rating to go here</td>
            <td>
                <a href="{% url 'send_enrolment_request_view' listing.pk %}">
                    Send a request
                </a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">
                There are no available listings.
            </td>
        </tr>
        {% endfor %}
    </table>
</body>

</html>
