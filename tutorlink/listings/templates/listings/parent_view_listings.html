<!DOCTYPE html>
<html>
    <head>
        <title>
            Available Listings
        </title>
    </head>
    <body>
        <h1>Available listings</h1>
        <a href="{% url 'index' %}">Home</a>
        <table border="1" style="width: 100%;">
            <tr>
                <th>Listing</th>
                <th>Rate</th>
                <th>Action</th>
            </tr>
            {% for listing in listings %}
            <tr>
                <td>{{ listing }}</td>
                <td>{{ listing.rate_per_hour }}</td>
                <td>
                    <a href="{% url 'send_enrolment_request_view' listing.pk %}">
                        Send a request
                    </a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3">
                    There are no available listings.
                </td>
            </tr>
            {% endfor %}
        </table>
    </body>
</html>
