{% extends 'base.html' %}

{% block header %}
    Edit {{ target.email }}
{% endblock %}

{% block content %}
    <p>Role: {{ target.get_role_display }}</p>

    <form method="post">
        {% csrf_token %}
        {{ form }}
        <button type="submit">Save</button>
    </form>

    <a href="{% url 'admin_user_list' %}">Cancel</a>
{% endblock %}
